# Round-robin load balancer across two API replicas. This is the piece
# that turns "I built an API" into "I built something I can explain
# horizontal scaling for": nginx spreads requests across api1 and api2,
# and because both instances share the same Postgres DB and Redis cache
# (see docker-compose.yml), either one can handle any request -- there's
# no per-instance state, which is what makes adding a third replica just
# a matter of adding another line here.
upstream api_backend {
    server api1:8000;
    server api2:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
