name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # A real Postgres for the concurrency test. SQLite would hide the
    # race it checks for (SQLite allows only one writer at a time).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: transactions_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d transactions_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CONCURRENCY_TEST_DATABASE_URL: postgresql://app:app@localhost:5432/transactions_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
