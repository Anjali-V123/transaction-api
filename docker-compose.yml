version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d transactions"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

  # Runs the schema creation exactly once, before either API replica
  # starts, then exits. This exists because starting two replicas
  # straight at an empty Postgres database is a real race (see
  # app/init_db.py) -- api1 and api2 both wait for this to finish
  # successfully instead of racing to create the schema themselves.
  migrate:
    build: .
    command: ["python", "-m", "app.init_db"]
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/transactions
    depends_on:
      postgres:
        condition: service_healthy

  api1:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/transactions
      REDIS_URL: redis://redis:6379/0
      INSTANCE_NAME: api1
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-this-in-production}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  api2:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/transactions
      REDIS_URL: redis://redis:6379/0
      INSTANCE_NAME: api2
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-this-in-production}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api1
      - api2

volumes:
  postgres_data:
